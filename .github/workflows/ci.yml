# Marionette.NET — Continuous Integration
#
# Two jobs run in parallel on every push to main / phase-* / feat/* / fix/*
# branches and on every pull_request event:
#
#   build-and-test       — gates the three Phase-0 promises:
#                            * Solution builds clean in Debug + Release.
#                            * StripeProbe Release with EnableMcpAutomation=false
#                              contains zero Runtime/Adapter.Wpf/Ai/MCP symbols
#                              (Spike A — IL stripping promise).
#                            * StripeProbe Debug with =true completes a real MCP
#                              initialize -> tools/list -> tools/call handshake
#                              over stdio with zero stdout pollution
#                              (Spike C — stdio MCP host).
#
#   aot-publish-smoke    — gates the AOT readiness claim:
#                            * Stripped + full AOT publishes both succeed on a
#                              runner with the C++ desktop workload available
#                              (Spike B's environmental block does not apply
#                              on windows-latest).
#                            * The stripped .exe at least launches without
#                              crashing immediately.
#
# Background and rationale live in:
#   PHASE0_FINDINGS.md
#   .phase0/spike-a.md  (IL probe details)
#   .phase0/spike-b.md  (AOT publish prerequisites)
#   .phase0/spike-c.md  (stdio handshake harness)
#
# Scope intentionally tight: this is a Phase-1 CI bootstrap, not a release pipeline.
# NuGet packing, signing, GitHub Pages, and badge generation are deferred to Phase 7.
#
# All work runs on windows-latest because Phase 1's only adapter is Adapter.Wpf,
# which requires Windows. Adapter.Avalonia / WinUI / Uno / MAUI may want a matrix
# expansion when they land in Phases 2-5.

name: CI

on:
  push:
    branches:
      - main
      - 'phase-*'
      - 'feat/*'
      - 'fix/*'
  pull_request:

# Cancel any in-flight run on the same ref when a new commit lands. PR head
# branches get their own group; pushes to main cancel previous main runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token. CI does not pack or push anything — Phase 7 will widen this
# when releases start.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  # Matches the SDK pinned in global.json (10.0.202 with rollForward=latestFeature).
  # Spike B verified the Microsoft-hosted windows-latest image ships the "Desktop
  # development with C++" workload, which Native AOT requires.
  DOTNET_VERSION: '10.0.x'

jobs:

  build-and-test:
    name: Build, IL probe, stdio handshake
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          # global.json pins the exact patch line. setup-dotnet honours global.json
          # when present; the dotnet-version above is the floor.

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Keyed on every csproj plus Directory.Build.props. Directory.Packages.props
          # is included in the hash even though it doesn't exist yet — it will once
          # Phase 1 introduces central package management, and the cache key is
          # forward-compatible.
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore SDK workloads
        # global.json pins SDK 10.0.202 with rollForward=latestFeature; the
        # runner image's preinstalled MAUI workloads target a different SDK.
        # Once setup-dotnet resolves to the runner's actual latest 10.0.x,
        # `<UseMaui>true</UseMaui>` + `<SingleProject>true</SingleProject>` in
        # Marionette.NET.Adapter.Maui pulls a manifest that demands every
        # maui-* sub-workload (incl. maui-tizen) — and the resolved SDK's
        # manifest doesn't match what the image preinstalled.
        # `workload restore` against the solution installs whatever the
        # resolved SDK's manifest needs. Idempotent, ~90s on cold restore.
        run: dotnet workload restore Marionette.NET.sln
        shell: pwsh

      - name: Restore solution
        run: dotnet restore Marionette.NET.sln

      - name: Build solution (Debug)
        # Asserts that the masterplan's Debug-defaults (EnableMcpAutomation=true on
        # the sample) build cleanly. TWAE is true in Directory.Build.props, so any
        # compile warning in any project will fail this step.
        run: dotnet build Marionette.NET.sln -c Debug --no-restore

      - name: Build solution (Release)
        # Asserts that the masterplan's Release-defaults (EnableMcpAutomation=false
        # on the sample) build cleanly.
        run: dotnet build Marionette.NET.sln -c Release --no-restore

      - name: Build StripeProbe Release with EnableMcpAutomation=false
        # Explicit check: the strip-mode build path produces a clean compile.
        # Cleaning bin/obj first ensures the inspected output is not stale incremental
        # output (Spike A learned this the hard way).
        run: |
          if (Test-Path samples\Sample.Wpf.StripeProbe\bin)  { Remove-Item -Recurse -Force samples\Sample.Wpf.StripeProbe\bin }
          if (Test-Path samples\Sample.Wpf.StripeProbe\obj)  { Remove-Item -Recurse -Force samples\Sample.Wpf.StripeProbe\obj }
          dotnet build samples\Sample.Wpf.StripeProbe\Sample.Wpf.StripeProbe.csproj -c Release -p:EnableMcpAutomation=false
        shell: pwsh

      - name: Build StripeProbe Release with EnableMcpAutomation=true
        # The MCP-on Release path also has to build cleanly — used for full-flight
        # integration scenarios (Frozen-Mode, Phase-1 Always-On Production).
        run: |
          if (Test-Path samples\Sample.Wpf.StripeProbe\bin)  { Remove-Item -Recurse -Force samples\Sample.Wpf.StripeProbe\bin }
          if (Test-Path samples\Sample.Wpf.StripeProbe\obj)  { Remove-Item -Recurse -Force samples\Sample.Wpf.StripeProbe\obj }
          dotnet build samples\Sample.Wpf.StripeProbe\Sample.Wpf.StripeProbe.csproj -c Release -p:EnableMcpAutomation=true
        shell: pwsh

      - name: Build IL probe (.phase0/ProbeIl)
        # Out-of-solution by design (Phase-0 utility). Release for runtime speed.
        run: dotnet build .phase0\ProbeIl\ProbeIl.csproj -c Release

      - name: Build stdio handshake harness (.phase0/StdioTest)
        # Out-of-solution by design. Debug is fine — this is a probe.
        run: dotnet build .phase0\StdioTest\StdioTest.csproj -c Debug

      - name: Build StripeProbe (Release, =false) for IL probe
        # Re-build the stripped Release output cleanly. Earlier steps may have
        # stomped on bin/obj with the =true variant.
        run: |
          if (Test-Path samples\Sample.Wpf.StripeProbe\bin)  { Remove-Item -Recurse -Force samples\Sample.Wpf.StripeProbe\bin }
          if (Test-Path samples\Sample.Wpf.StripeProbe\obj)  { Remove-Item -Recurse -Force samples\Sample.Wpf.StripeProbe\obj }
          dotnet build samples\Sample.Wpf.StripeProbe\Sample.Wpf.StripeProbe.csproj -c Release -p:EnableMcpAutomation=false
        shell: pwsh

      - name: IL stripping regression check
        # Spike A's pass criterion: zero hits for any of the four needles in the
        # stripped sample DLL. We target Sample.Wpf.StripeProbe.dll directly rather
        # than the whole bin folder because the Marionette.Ai TypeDef legitimately
        # lives in Marionette.NET.Abstractions.dll, which always ships. The strip
        # check is about the SAMPLE assembly's symbols, not the always-shipped
        # attribute assembly.
        run: |
          pwsh -NoProfile -File build\Run-IlProbe.ps1 `
              -ProbeDll .phase0\ProbeIl\bin\Release\net10.0\ProbeIl.dll `
              -Target   samples\Sample.Wpf.StripeProbe\bin\Release\net10.0-windows\Sample.Wpf.StripeProbe.dll `
              -LogPath  ilprobe.log
        shell: pwsh

      - name: Build StripeProbe (Debug, =true) for stdio handshake
        # The stdio harness needs the MCP-on build. Debug is what Spike C uses.
        run: |
          if (Test-Path samples\Sample.Wpf.StripeProbe\bin)  { Remove-Item -Recurse -Force samples\Sample.Wpf.StripeProbe\bin }
          if (Test-Path samples\Sample.Wpf.StripeProbe\obj)  { Remove-Item -Recurse -Force samples\Sample.Wpf.StripeProbe\obj }
          dotnet build samples\Sample.Wpf.StripeProbe\Sample.Wpf.StripeProbe.csproj -c Debug -p:EnableMcpAutomation=true
        shell: pwsh

      - name: Stdio MCP handshake test (Spike C harness)
        # The harness exits 0 on PASS, 1 on FAIL. Path must be absolute (Spike C
        # learned that ProcessStartInfo.FileName resolves against the OS, not the
        # .NET process's CWD).
        run: |
          $exe = Resolve-Path samples\Sample.Wpf.StripeProbe\bin\Debug\net10.0-windows\Sample.Wpf.StripeProbe.exe
          dotnet .phase0\StdioTest\bin\Debug\net10.0\StdioTest.dll "$exe" 2>&1 | Tee-Object -FilePath stdio-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Upload diagnostic logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}
          path: |
            ilprobe.log
            stdio-test.log
            **/*.binlog
            **/MSBuild_*.log
          if-no-files-found: ignore
          retention-days: 14

  aot-publish-smoke:
    name: AOT publish smoke test
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore SDK workloads
        # See build-and-test job for the full rationale. Same fix is needed
        # here because the AOT publish chain also restores the solution
        # (transitively pulls the MAUI adapter even when only the StripeProbe
        # is being published).
        run: dotnet workload restore Marionette.NET.sln
        shell: pwsh

      - name: Restore solution
        run: dotnet restore Marionette.NET.sln

      - name: AOT publish — stripped (EnableMcpAutomation=false)
        # Spike B verified the csproj is correctly wired: _SuppressWpfTrimError + the
        # AOT property group will produce a working publish on a runner with the
        # C++ desktop workload (which windows-latest provides). Capture analyzer
        # output to a binary log so failures can be replayed offline.
        run: |
          dotnet publish samples\Sample.Wpf.StripeProbe\Sample.Wpf.StripeProbe.csproj `
              -c Release `
              -r win-x64 `
              -p:PublishAot=true `
              -p:EnableMcpAutomation=false `
              -warnaserror:false `
              -o publish-aot-off `
              -bl:aot-off.binlog
        shell: pwsh

      - name: AOT publish — full (EnableMcpAutomation=true)
        # Spike B noted that this path emits IL2xxx/IL3xxx warnings from the
        # ModelContextProtocol reflection paths and Microsoft.Extensions.Hosting.
        # Per the masterplan and Phase-0 findings, warnings are tolerated for now
        # but captured for review. -warnaserror:false ensures the build proceeds
        # and the binlog preserves the full analyzer output.
        run: |
          dotnet publish samples\Sample.Wpf.StripeProbe\Sample.Wpf.StripeProbe.csproj `
              -c Release `
              -r win-x64 `
              -p:PublishAot=true `
              -p:EnableMcpAutomation=true `
              -warnaserror:false `
              -o publish-aot-on `
              -bl:aot-on.binlog
        shell: pwsh

      - name: Verify stripped AOT binary was produced
        # Originally a launch-and-wait smoke test, but spike-b-followup.md found
        # that WPF GUI mode crashes under AOT runtime with STATUS_STACK_BUFFER_OVERRUN
        # (Microsoft-known WPF+AOT limitation, not a Marionette defect). The
        # meaningful AOT runtime smoke test is the --mcp --headless handshake
        # below, which exercises the full code path *without* loading WPF.
        # For the stripped binary we just verify it was produced and is non-trivial.
        run: |
          $exe = "publish-aot-off\Sample.Wpf.StripeProbe.exe"
          if (-not (Test-Path $exe)) { Write-Host "FAIL: stripped AOT exe not produced at $exe"; exit 1 }
          $size = (Get-Item $exe).Length
          if ($size -lt 1MB)         { Write-Host "FAIL: stripped AOT exe suspiciously small: $size bytes"; exit 1 }
          Write-Host "PASS: stripped AOT exe produced ($([math]::Round($size/1MB,1)) MB)"
        shell: pwsh

      - name: Smoke-test AOT-on binary via stdio handshake
        # Build the StdioTest harness against the AOT-published exe. The harness
        # accepts a path argument so we can point it at either the JIT'd or the
        # AOT'd binary. The AOT-on build's --mcp --headless mode is what we want
        # to verify — spinning up the MCP server end-to-end with native code.
        # Phase 10 (2026-05-05): per-method dynamic tools are now AOT-clean
        # (registration switched to McpServerTool.Create(AIFunction, ...) via
        # the MarionetteAIFunction subclass; the SDK's reflection-based
        # AIFunctionFactory.Create path is no longer in play). The handshake
        # exercises both meta-tools and dynamic tools; failures here are real
        # regressions, not the historical SDK-blocker.
        run: |
          dotnet build .phase0\StdioTest\StdioTest.csproj -c Debug
          $exe = Resolve-Path publish-aot-on\Sample.Wpf.StripeProbe.exe
          dotnet .phase0\StdioTest\bin\Debug\net10.0\StdioTest.dll "$exe" 2>&1 | Tee-Object -FilePath stdio-aot.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      # ----- Phase 3.3: Avalonia Dashboard AOT publish smoke -----------------
      #
      # PHASE2_FINDINGS follow-up #2 deferred Avalonia AOT to the first push
      # against this workflow. The Avalonia Dashboard sample already builds in
      # Debug; the AOT-publish flow is what this job exercises end-to-end. The
      # stripped publish (=false) must succeed cleanly; the full publish (=on)
      # is allowed to emit warnings — the IL2xxx warnings come from the same
      # third-party reflection paths the StripeProbe AOT-on build tolerates.
      #
      # Avalonia GUI mode under AOT may also crash inherently (the same
      # WPF-known limitation in spirit; documented in the report if observed).
      # The meaningful runtime check is again the --mcp --headless handshake
      # below.

      - name: AOT publish — Avalonia Dashboard stripped (EnableMcpAutomation=false)
        run: |
          dotnet publish samples\Sample.Avalonia.Dashboard\Sample.Avalonia.Dashboard.csproj `
              -c Release `
              -r win-x64 `
              -p:PublishAot=true `
              -p:EnableMcpAutomation=false `
              -warnaserror:false `
              -o publish-aot-avalonia-off `
              -bl:aot-avalonia-off.binlog
        shell: pwsh

      - name: AOT publish — Avalonia Dashboard full (EnableMcpAutomation=true)
        run: |
          dotnet publish samples\Sample.Avalonia.Dashboard\Sample.Avalonia.Dashboard.csproj `
              -c Release `
              -r win-x64 `
              -p:PublishAot=true `
              -p:EnableMcpAutomation=true `
              -warnaserror:false `
              -o publish-aot-avalonia-on `
              -bl:aot-avalonia-on.binlog
        shell: pwsh

      - name: Verify stripped Avalonia AOT binary was produced
        # Mirrors the StripeProbe stripped check. Avalonia GUI mode under AOT
        # may crash inherently on launch (same class of issue as WPF+AOT); we
        # intentionally do NOT launch the binary here. The meaningful runtime
        # check is the --mcp --headless handshake below.
        run: |
          $exe = "publish-aot-avalonia-off\Sample.Avalonia.Dashboard.exe"
          if (-not (Test-Path $exe)) { Write-Host "FAIL: stripped Avalonia AOT exe not produced at $exe"; exit 1 }
          $size = (Get-Item $exe).Length
          if ($size -lt 1MB)         { Write-Host "FAIL: stripped Avalonia AOT exe suspiciously small: $size bytes"; exit 1 }
          Write-Host "PASS: stripped Avalonia AOT exe produced ($([math]::Round($size/1MB,1)) MB)"
        shell: pwsh

      - name: Smoke-test AOT-on Avalonia binary via stdio handshake
        # Same pattern as the StripeProbe step above. Use --avalonia mode in
        # the harness so DashboardViewModel's manifest is asserted, plus the
        # per-method dynamic tools and resource subscribe path. Phase 10:
        # AOT-clean dynamic tools are now load-bearing — failures are real
        # regressions.
        run: |
          $exe = Resolve-Path publish-aot-avalonia-on\Sample.Avalonia.Dashboard.exe
          dotnet .phase0\StdioTest\bin\Debug\net10.0\StdioTest.dll "$exe" --avalonia 2>&1 | Tee-Object -FilePath stdio-aot-avalonia.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      # ----- Phase 4.2: TodoApp / FormLab / PocketPlanner AOT publish ---------
      #
      # Phase 4.2 extends the AOT-publish smoke matrix to the four remaining
      # Phase-1+ samples (TodoApp, Dashboard already above, FormLab, PocketPlanner).
      # Per-sample expectations:
      #
      #   * TodoApp (WPF):     publishes cleanly, GUI under AOT crashes (Phase-0
      #                        Spike B-followup; WPF+AOT Microsoft-known limitation),
      #                        --mcp --headless handshake succeeds.
      #   * FormLab (WinUI 3): publishes cleanly with .NET 10 + WindowsAppSDK 2.x
      #                        AOT support. Stripped GUI launch may or may not work
      #                        — verify binary existence only. The runtime install
      #                        step below is required: an unpackaged WinAppSDK 2.x
      #                        EXE hangs in the bootstrap on a runner without the
      #                        2.x WindowsAppRuntime present.
      #   * PocketPlanner (MAUI):  MAUI 10.x AOT support is partial; publish may
      #                            emit framework IL3xxx warnings or fail outright.
      #                            continue-on-error makes the step non-fatal so
      #                            the rest of the matrix proceeds.
      #
      # All publishes use the same shape: stripped (=false) + full (=true), with
      # -warnaserror:false so adopters see warnings rather than build aborts.

      - name: AOT publish — TodoApp stripped (EnableMcpAutomation=false)
        run: |
          dotnet publish samples\Sample.Wpf.TodoApp\Sample.Wpf.TodoApp.csproj `
              -c Release `
              -r win-x64 `
              -p:PublishAot=true `
              -p:EnableMcpAutomation=false `
              -warnaserror:false `
              -o publish-aot-todoapp-off `
              -bl:aot-todoapp-off.binlog
        shell: pwsh

      - name: AOT publish — TodoApp full (EnableMcpAutomation=true)
        run: |
          dotnet publish samples\Sample.Wpf.TodoApp\Sample.Wpf.TodoApp.csproj `
              -c Release `
              -r win-x64 `
              -p:PublishAot=true `
              -p:EnableMcpAutomation=true `
              -warnaserror:false `
              -o publish-aot-todoapp-on `
              -bl:aot-todoapp-on.binlog
        shell: pwsh

      - name: Verify stripped TodoApp AOT binary was produced
        run: |
          $exe = "publish-aot-todoapp-off\Sample.Wpf.TodoApp.exe"
          if (-not (Test-Path $exe)) { Write-Host "FAIL: stripped AOT exe not produced at $exe"; exit 1 }
          $size = (Get-Item $exe).Length
          if ($size -lt 1MB)         { Write-Host "FAIL: stripped AOT exe suspiciously small: $size bytes"; exit 1 }
          Write-Host "PASS: stripped AOT exe produced ($([math]::Round($size/1MB,1)) MB)"
        shell: pwsh

      - name: Smoke-test AOT-on TodoApp via stdio handshake (--todoapp)
        # Phase 10: dynamic-tool path is AOT-clean (MarionetteAIFunction
        # subclass + McpServerTool.Create(AIFunction, ...) overload). Failures
        # here are real regressions.
        run: |
          $exe = Resolve-Path publish-aot-todoapp-on\Sample.Wpf.TodoApp.exe
          dotnet .phase0\StdioTest\bin\Debug\net10.0\StdioTest.dll "$exe" --todoapp 2>&1 | Tee-Object -FilePath stdio-aot-todoapp.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Install WindowsAppRuntime 2.x (required for unpackaged WinAppSDK 2.x bootstrap)
        # WinAppSDK 2.x's unpackaged bootstrap needs the matching
        # Microsoft.WindowsAppRuntime 2.x MSIX framework package on the
        # runner. windows-latest images do not yet ship 2.x by default.
        # Without this step, the FormLab `--mcp --headless` smoke test
        # below hangs silently (no JSON-RPC frames, no stderr) waiting
        # for a runtime it cannot find. The aka.ms shortlink redirects
        # to the canonical Microsoft download.
        run: |
          $url = "https://aka.ms/windowsappsdk/2.0/2.0.1/windowsappruntimeinstall-x64.exe"
          $exe = Join-Path $env:RUNNER_TEMP "WindowsAppRuntimeInstall-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          & $exe --quiet
          if ($LASTEXITCODE -ne 0) { Write-Host "FAIL: WindowsAppRuntime install exited $LASTEXITCODE"; exit $LASTEXITCODE }
          Get-AppxPackage -Name "*WindowsAppRuntime.2*" | Select-Object Name,Version,Architecture | Format-Table -AutoSize
        shell: pwsh

      - name: AOT publish — FormLab stripped (EnableMcpAutomation=false)
        run: |
          dotnet publish samples\Sample.WinUI.FormLab\Sample.WinUI.FormLab.csproj `
              -c Release `
              -r win-x64 `
              -p:PublishAot=true `
              -p:EnableMcpAutomation=false `
              -warnaserror:false `
              -o publish-aot-formlab-off `
              -bl:aot-formlab-off.binlog
        shell: pwsh

      - name: AOT publish — FormLab full (EnableMcpAutomation=true)
        run: |
          dotnet publish samples\Sample.WinUI.FormLab\Sample.WinUI.FormLab.csproj `
              -c Release `
              -r win-x64 `
              -p:PublishAot=true `
              -p:EnableMcpAutomation=true `
              -warnaserror:false `
              -o publish-aot-formlab-on `
              -bl:aot-formlab-on.binlog
        shell: pwsh

      - name: Verify stripped FormLab AOT binary was produced
        run: |
          $exe = "publish-aot-formlab-off\Sample.WinUI.FormLab.exe"
          if (-not (Test-Path $exe)) { Write-Host "FAIL: stripped AOT exe not produced at $exe"; exit 1 }
          $size = (Get-Item $exe).Length
          if ($size -lt 1MB)         { Write-Host "FAIL: stripped AOT exe suspiciously small: $size bytes"; exit 1 }
          Write-Host "PASS: stripped AOT exe produced ($([math]::Round($size/1MB,1)) MB)"
        shell: pwsh

      - name: Smoke-test AOT-on FormLab via stdio handshake (--winui)
        # Phase 10: dynamic-tool path is AOT-clean across every adapter.
        run: |
          $exe = Resolve-Path publish-aot-formlab-on\Sample.WinUI.FormLab.exe
          dotnet .phase0\StdioTest\bin\Debug\net10.0\StdioTest.dll "$exe" --winui 2>&1 | Tee-Object -FilePath stdio-aot-formlab.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: AOT publish — PocketPlanner stripped (EnableMcpAutomation=false)
        # MAUI's AOT support is the most fragile of the four heads (Phase 4.2
        # finding). continue-on-error tolerates publish failures pending
        # Phase 6 / Microsoft fixes.
        continue-on-error: true
        run: |
          dotnet publish samples\Sample.Maui.PocketPlanner\Sample.Maui.PocketPlanner.csproj `
              -c Release `
              -r win-x64 `
              -p:PublishAot=true `
              -p:EnableMcpAutomation=false `
              -warnaserror:false `
              -o publish-aot-pocketplanner-off `
              -bl:aot-pocketplanner-off.binlog
        shell: pwsh

      - name: AOT publish — PocketPlanner full (EnableMcpAutomation=true)
        continue-on-error: true
        run: |
          dotnet publish samples\Sample.Maui.PocketPlanner\Sample.Maui.PocketPlanner.csproj `
              -c Release `
              -r win-x64 `
              -p:PublishAot=true `
              -p:EnableMcpAutomation=true `
              -warnaserror:false `
              -o publish-aot-pocketplanner-on `
              -bl:aot-pocketplanner-on.binlog
        shell: pwsh

      - name: Verify stripped PocketPlanner AOT binary was produced
        # Best-effort; MAUI AOT publish may have skipped over.
        continue-on-error: true
        run: |
          $exe = "publish-aot-pocketplanner-off\Sample.Maui.PocketPlanner.exe"
          if (-not (Test-Path $exe)) { Write-Host "WARN: stripped AOT exe not produced at $exe (MAUI AOT known-fragile)"; exit 0 }
          $size = (Get-Item $exe).Length
          if ($size -lt 1MB)         { Write-Host "WARN: stripped AOT exe suspiciously small: $size bytes"; exit 0 }
          Write-Host "PASS: stripped AOT exe produced ($([math]::Round($size/1MB,1)) MB)"
        shell: pwsh

      - name: Smoke-test AOT-on PocketPlanner via stdio handshake (--maui)
        continue-on-error: true
        run: |
          $exe = "publish-aot-pocketplanner-on\Sample.Maui.PocketPlanner.exe"
          if (-not (Test-Path $exe)) { Write-Host "SKIP: PocketPlanner AOT exe not present (MAUI publish may have failed)"; exit 0 }
          $abs = Resolve-Path $exe
          dotnet .phase0\StdioTest\bin\Debug\net10.0\StdioTest.dll "$abs" --maui 2>&1 | Tee-Object -FilePath stdio-aot-pocketplanner.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Upload publish artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-aot-logs-${{ github.run_id }}
          path: |
            aot-off.binlog
            aot-on.binlog
            aot-avalonia-off.binlog
            aot-avalonia-on.binlog
            aot-todoapp-off.binlog
            aot-todoapp-on.binlog
            aot-formlab-off.binlog
            aot-formlab-on.binlog
            aot-pocketplanner-off.binlog
            aot-pocketplanner-on.binlog
            stdio-aot.log
            stdio-aot-avalonia.log
            stdio-aot-todoapp.log
            stdio-aot-formlab.log
            stdio-aot-pocketplanner.log
            publish-aot-off/**/*
            publish-aot-on/**/*
            publish-aot-avalonia-off/**/*
            publish-aot-avalonia-on/**/*
            publish-aot-todoapp-off/**/*
            publish-aot-todoapp-on/**/*
            publish-aot-formlab-off/**/*
            publish-aot-formlab-on/**/*
            publish-aot-pocketplanner-off/**/*
            publish-aot-pocketplanner-on/**/*
          if-no-files-found: ignore
          retention-days: 14
